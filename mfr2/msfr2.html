            <!--   PLAY // PAUSE SCRIPT    -->
            <script> 

                    const audio = document.getElementById('bg-music');

                    const muteBtn = document.getElementById('mute-btn');

                    const muteIcon = document.getElementById('mute-icon');

                    // Comfortable volume
                    audio.volume = 0.4;

                    // Paths to your images
                    const playImg = '../img/util/play.png';
                    
                    const muteImg = '../img/util/mute.png';

                    // Try to autoplay
                    window.addEventListener('load', () => {

                        const playPromise = audio.play();

                        if (playPromise !== undefined) {

                        playPromise

                            .then(() => {

                            // Successfully started playing
                            muteIcon.src = playImg;

                            })

                            .catch(() => {

                            // Autoplay blocked – show play icon so user can start it
                            muteIcon.src = playImg;

                            });

                        }

                    });

                    // Button click handler

                    muteBtn.addEventListener('click', () => {

                        if (audio.paused) {

                        // Start playing

                        audio.play();

                        audio.muted = false;

                        muteIcon.src = playImg;

                        } else {

                        // Toggle mute

                        audio.muted = !audio.muted;

                        muteIcon.src = audio.muted ? muteImg : playImg;

                        }

                    });

            </script>

            <!--  Parallax Script  -->
            <script>

                const bg = document.querySelector('.parallax-bg');

                    window.addEventListener('scroll', function() {

                    const scrolled = window.pageYOffset;

                    bg.style.transform = 'translate3d(0, ' + (scrolled * -0.4) + 'px, 0)';

                    });

            </script>
