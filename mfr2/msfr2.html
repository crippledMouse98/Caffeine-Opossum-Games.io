<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caffeine Opossum Games — Misfire 2</title>
  <link rel="stylesheet" href="../css/msfr__.css">
</head>
<body>
  <div class="parallax-bg"></div>

  <a href="../index.html" class="back-btn" title="Go Back">
    <img src="../img/msc/gbck.png" alt="Back">
  </a>

  <div class="side-socials">
    <a href="https://www.youtube.com/@MISFIRE98" target="_blank" rel="noopener noreferrer" class="side-social">
      <img src="../img/util/Youtube Icon.png" alt="YouTube">
      <span class="side-social-label">YouTube</span>
    </a>
    <a href="https://discord.gg/SP8hpWZaHq" target="_blank" rel="noopener noreferrer" class="side-social">
      <img src="../img/util/Discord Icon.png" alt="Discord">
      <span class="side-social-label">Discord</span>
    </a>
    <a href="https://www.patreon.com/cw/CaffeineOppsumGames" target="_blank" rel="noopener noreferrer" class="side-social">
      <img src="../img/util/Patreon.png" alt="Patreon">
      <span class="side-social-label">Patreon</span>
    </a>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="../snd/bgm.mp3" type="audio/mpeg">
  </audio>
  <button id="mute-btn" class="mute-btn" title="Mute / Unmute">
    <img id="mute-icon" src="../img/util/play.png" alt="Sound">
  </button>

  <main class="page">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-copy">
        <img src="../img/logos/msfr2lgo.png" alt="Misfire 2" class="logo">
        <p class="hero-tag">
          In development. Version 0.01 gameplay reveal is live.
          <strong>More cars, arenas, and chaos incoming.</strong>
        </p>
      </div>
      <div class="hero-media">
        <video controls>
          <source src="../img/msfr2/indev/Unity_n3acPIeeBx.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- BENTO -->
    <section class="bento">
      <div class="panel bento-reveal" style="grid-column: span 7;">
        <p class="title title-left"><strong>Version 0.01 Gameplay Reveal</strong></p>
        <video controls>
          <source src="../img/msfr2/indev/Misfire 2 (Version 0.01) gameplay reveal.mp4" type="video/mp4">
        </video>
      </div>

      <div class="panel bento-cars" style="grid-column: span 5;">
        <p class="title strip-label"><strong>Cars</strong></p>
        <div class="card-strip">
          <a href="barricade.html" class="archive-card">
            <img src="img/barricade/Barricade_001.png" alt="Barricade">
          </a>
        </div>
      </div>

      <div class="panel bento-arenas" style="grid-column: span 12;">
        <p class="title strip-label"><strong>[REDACTED]</strong></p>
        <p style="margin:0; color: var(--muted); text-align:center;">Arenas coming soon.</p>
      </div>
    </section>

  </main>

  <!-- FULL-BLEED SCREENSHOTS -->
  <section class="band">
    <div class="band-inner">
      <p class="title"><strong>Screenshots</strong></p>
      <div class="screenshot-grid">
        <img src="../img/msfr2/teaser_shot_2.png" alt="Screenshot 0" class="screenshot">
        <img src="../img/msfr2/Misfire 2 Screenshot (1).png" alt="Screenshot 1" class="screenshot">
        <img src="../img/msfr2/Misfire 2 Screenshot (2).png" alt="Screenshot 2" class="screenshot">
        <img src="../img/msfr2/Misfire 2 Screenshot (3).png" alt="Screenshot 3" class="screenshot">
        <img src="img/screenshots/image-1.png" alt="REDACTED" class="screenshot">
        <img src="img/screenshots/image-2.png" alt="REDACTED" class="screenshot">
        <img src="img/screenshots/image-3.png" alt="REDACTED" class="screenshot">
        <img src="img/screenshots/image-4.png" alt="REDACTED" class="screenshot">
        <img src="img/screenshots/image-5.png" alt="REDACTED" class="screenshot">
      </div>
    </div>
  </section>

  <footer>
    © 2026 Caffeine Opossum Games<br>
    All rights reserved.<br>
    <a href="../LICENSE" style="color: var(--bright-yellow);">Licence</a>
  </footer>

  <script>
    const audio = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    audio.volume = 0.4;
    const playImg = '../img/util/play.png';
    const muteImg = '../img/util/mute.png';
    window.addEventListener('load', () => {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => { muteIcon.src = playImg; }).catch(() => { muteIcon.src = playImg; });
      }
    });
    muteBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        audio.muted = false;
        muteIcon.src = playImg;
      } else {
        audio.muted = !audio.muted;
        muteIcon.src = audio.muted ? muteImg : playImg;
      }
    });
  </script>
  <script>
        const bg = document.querySelector('.parallax-bg');
        window.addEventListener('scroll', function () {
        const scrolled = window.pageYOffset;
        bg.style.backgroundPosition = 'center ' + (scrolled * -0.15) + 'px';
        }, { passive: true });
  </script>
  <script src="../js/main.js" defer></script>
  <script src="../js/gallery.js" defer></script>
</body>
</html>
